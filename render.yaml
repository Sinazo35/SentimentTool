services:
  - type: web
    name: pulse-scope
    runtime: python
    plan: free
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 -m gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PULSE_SCOPE_HISTORY
        value: /tmp/pulse-scope-history.json
