[build]
  command = "python -m pip install -r requirements.txt && mkdir -p public/static && cp templates/index.html public/index.html && cp static/style.css static/app.js public/static/ && python -m compileall -q app.py netlify/functions"
  publish = "public"

[build.processing]
  skip_processing = false

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/app"
  status = 200
